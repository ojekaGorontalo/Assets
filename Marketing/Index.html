<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Duta JEGO - Portal Mitra</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        /* Login Card */
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 24px 20px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .login-card h1 {
            color: #FF9800;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .login-card p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            /* mencegah zoom otomatis di iOS */
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #FF9800;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #F57C00;
        }

        .error {
            color: #f44336;
            margin-top: 12px;
            font-size: 13px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }

        /* Dashboard Styles - Mobile First */
        .header {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: white;
            padding: 16px 18px;
            border-radius: 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn {
            background: rgba(0, 0, 0, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            width: auto;
            font-size: 0.85rem;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 14px;
            border-left: 4px solid #FF9800;
            padding-left: 12px;
        }

        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-box {
            flex: 1;
            min-width: 120px;
            background: #fff3e0;
            padding: 14px;
            border-radius: 16px;
            text-align: center;
        }

        .stat-box div:first-child {
            font-size: 0.85rem;
            color: #666;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #FF9800;
            line-height: 1.2;
        }

        .progress-bar {
            background: #e9ecef;
            border-radius: 20px;
            height: 20px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-fill {
            background: #FF9800;
            height: 100%;
            width: 0%;
            border-radius: 20px;
            transition: width 0.3s;
        }

        .target-item {
            margin-bottom: 16px;
        }

        .target-item div:first-child {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            background: white;
        }

        .dashboard-btn {
            background: #FF9800;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
            margin-top: 8px;
        }

        /* Tabel mobile dengan scroll horizontal */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        th,
        td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 0.85rem;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            display: inline-block;
            white-space: nowrap;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-disetujui {
            background: #d4edda;
            color: #155724;
        }

        .status-ditolak {
            background: #f8d7da;
            color: #721c24;
        }

        /* Loading spinner */
        .loading {
            text-align: center;
            padding: 40px;
            color: #FF9800;
        }

        /* Responsive */
        @media (max-width: 500px) {
            body {
                padding: 8px;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }

            .stats {
                flex-direction: column;
            }

            .stat-box {
                width: 100%;
            }

            .card-title {
                font-size: 1.1rem;
            }

            .logout-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
